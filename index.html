<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IT CLUB - ระบบค้นหาชมรม</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="shortcut icon" href="img/HARRY.png" type="image/x-icon">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Anuphan:wght@300;400;500;600;700&display=swap');
        
        body {
            font-family: 'Anuphan', sans-serif;
        }

        /* สำหรับปรับแต่ง Table Scrollbar และ Sticky Column */
        .table-wrapper::-webkit-scrollbar {
            height: 8px;
            width: 8px;
        }
        .table-wrapper::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 10px;
        }
        .table-wrapper::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }
        .table-wrapper::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }

        .sticky-col {
            position: sticky;
            left: 0;
            z-index: 10;
        }
        
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
            animation: fadeIn 0.4s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-[#b9c4ff] via-[#d1e0ff] to-[#beffd8] py-8 px-4">

    <div class="max-w-7xl mx-auto space-y-6">
        
        <!-- Header Section -->
        <header class="bg-gradient-to-r from-blue-600 to-indigo-700 rounded-3xl p-8 shadow-2xl text-center text-white transform transition-all hover:scale-[1.01]">
            <div class="flex flex-col md:flex-row items-center justify-center gap-6">
                <img src="img/HARRY.png" alt="Logo" class="w-32 h-32 md:w-40 md:h-40 object-contain drop-shadow-lg" onerror="this.src='https://via.placeholder.com/150?text=IT+CLUB'">
                <div>
                    <h1 class="text-3xl md:text-5xl font-bold tracking-tight mb-2 drop-shadow-md">
                        ระบบค้นหาชมรมแผนกไอที
                    </h1>
                    <p class="text-blue-100 text-lg font-medium opacity-90">IT Club Search and Information System</p>
                </div>
            </div>
        </header>

        <!-- Filters Section -->
        <section class="bg-white/80 backdrop-blur-md border border-white/50 rounded-3xl p-6 shadow-xl">
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-6 gap-4 items-end">
                
                <div class="space-y-1">
                    <label class="text-sm font-semibold text-blue-900 ml-1">แผนก</label>
                    <select id="filter-group" class="w-full bg-white border-2 border-blue-100 rounded-xl px-4 py-2.5 focus:border-blue-500 focus:ring-2 focus:ring-blue-200 outline-none transition-all cursor-pointer">
                        <option value="all">ทั้งหมด</option>
                        <option value="ทค">ทค</option>
                        <option value="คภ">คภ</option>
                        <option value="สท">สท</option>
                    </select>
                </div>

                <div class="space-y-1">
                    <label class="text-sm font-semibold text-blue-900 ml-1">ระดับปี</label>
                    <select id="filter-year" class="w-full bg-white border-2 border-blue-100 rounded-xl px-4 py-2.5 focus:border-blue-500 focus:ring-2 focus:ring-blue-200 outline-none transition-all cursor-pointer">
                        <option value="all">ทั้งหมด</option>
                        <option value="1">ปี 1</option>
                        <option value="2">ปี 2</option>
                        <option value="3">ปี 3</option>
                        <option value="4">ปี 4</option>
                    </select>
                </div>

                <div class="space-y-1">
                    <label class="text-sm font-semibold text-blue-900 ml-1">ห้อง</label>
                    <select id="filter-room" class="w-full bg-white border-2 border-blue-100 rounded-xl px-4 py-2.5 focus:border-blue-500 focus:ring-2 focus:ring-blue-200 outline-none transition-all cursor-pointer">
                        <option value="all">ทั้งหมด</option>
                        <option value="ห้อง 1">ห้อง 1</option>
                        <option value="ห้อง 2">ห้อง 2</option>
                        <option value="ห้อง 3">ห้อง 3</option>
                        <option value="ห้อง 4">ห้อง 4</option>
                    </select>
                </div>

                <div class="space-y-1">
                    <label class="text-sm font-semibold text-blue-900 ml-1">ชมรม</label>
                    <select id="filter-club-select" class="w-full bg-white border-2 border-blue-100 rounded-xl px-4 py-2.5 focus:border-blue-500 focus:ring-2 focus:ring-blue-200 outline-none transition-all cursor-pointer">
                        <option value="all">ทั้งหมด</option>
                    </select>
                </div>

                <div class="space-y-1">
                    <label class="text-sm font-semibold text-blue-900 ml-1">ค้นหาด่วน</label>
                    <input type="text" id="filter-club" class="w-full bg-white border-2 border-blue-100 rounded-xl px-4 py-2.5 focus:border-blue-500 focus:ring-2 focus:ring-blue-200 outline-none transition-all" placeholder="รหัสนักศึกษา/ชื่อ...">
                </div>

                <button id="export-btn" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2.5 px-6 rounded-xl shadow-lg transition-all transform hover:-translate-y-1 flex items-center justify-center gap-2">
                    <i class="bi bi-file-earmark-excel"></i> Export Excel
                </button>
            </div>
        </section>

        <!-- Tabs Container -->
        <div id="tabs" class="flex flex-wrap gap-2 p-3 bg-blue-50/50 backdrop-blur-sm rounded-2xl shadow-inner border border-blue-100/50">
            <!-- Tabs will be injected here -->
        </div>

        <!-- Content Area -->
        <main id="tab-contents" class="min-h-[400px]">
            <div id="loading-spinner" class="flex flex-col items-center justify-center py-20 text-blue-600">
                <div class="animate-spin rounded-full h-12 w-12 border-4 border-blue-600 border-t-transparent mb-4"></div>
                <p class="font-medium">กำลังรวบรวมข้อมูล...</p>
            </div>
        </main>

        <!-- Footer -->
        <footer class="text-center pt-8 pb-4">
            <div class="inline-flex items-center gap-3 px-6 py-3 bg-white/40 backdrop-blur-sm rounded-full border border-white/50 shadow-sm text-gray-700 text-sm md:text-base">
                <i class="bi bi-code-slash text-blue-600 font-bold"></i>
                <span>ออกแบบและพัฒนาโดย <span class="font-bold text-blue-900">นายชลากร สุนทรนันท์</span></span>
                <span class="hidden md:inline text-gray-400">|</span>
                <span class="hidden md:inline italic">สาขาวิชาเครือข่ายคอมพิวเตอร์และความปลอดภัย</span>
            </div>
        </footer>
    </div>

    <!-- Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    
    <script>
        const clubs = {
            sports: ["ชมรมบาสเกตบอล", "ชมรมวอลเลย์บอล", "ชมรมแบดมินตัน", "ชมรมตะกร้อ", "ชมรมเปตอง"],
            arts: ["ชมรมศิลปะ", "ชมรมดนตรี", "ชมรมเชฟตัวน้อย", "ชมรมAnimation"],
            technology: ["ชมรมเขียนเว็บ", "ชมรมEsport", "ชมรมพิมพ์สัมผัสด้วยคอมพิวเตอร์", "ชมรมเทรดทองคำ"],
            academic: ["ชมรมหมากกระดาน"],
            others: ["ชมรมจิตอาสา", "Plant Club"]
        };

        const csvUrls = [
            { name: "ชมรมศิลปะ", url: "https://docs.google.com/spreadsheets/d/e/2PACX-1vTdlB_ZQlXPmgYvm2PE3VDE-UhmZxYIOEDdvT-I9h4OT7lJiQhYoN433yHqCfJZJmURxpfbuKJKnMnx/pub?gid=0&single=true&output=csv" },
            { name: "ชมรมแบดมินตัน", url: "https://docs.google.com/spreadsheets/d/e/2PACX-1vSpjBLenWp2nBZrU_RZ8kyuTN3TkMOJceSkIZgK2bwZ9GVRY1SsaNwkvmiwusAJHGqQabfxRrTfjZsL/pub?output=csv" },
            { name: "ชมรมเขียนเว็บ", url: "https://docs.google.com/spreadsheets/d/e/2PACX-1vQoQPzDkOVae4nxV-A2xVTRz0PDodwgCivhnCuJFcHwGEiMFonYVXwfjFfxJ4Ub1KVT8xew5m7jsi7c/pub?output=csv" },
            { name: "ชมรมEsport", url: "https://docs.google.com/spreadsheets/d/e/2PACX-1vQH06OwWlDV0f71pt_pg6dQu7fGEwHWIlQp6toqANItCkWE6xw4uKPO_6ucb8ZUqlvq23YAEKQYkesp/pub?output=csv" },
            { name: "ชมรมวอลเลย์บอล", url: "https://docs.google.com/spreadsheets/d/e/2PACX-1vS93jc9G9geI0wX3Ly_5zR8MWjFjl3oYyRWqs19DTafBaUi7o03uWFLpB1Ra0XchjolhWfzgNU0jp5u/pub?output=csv" },
            { name: "ชมรมเทรดทองคำ", url: "https://docs.google.com/spreadsheets/d/e/2PACX-1vR46FvH3p6mKdJA2RGjfWZbAouELt2qujhi_tJGFxZCDMdHzsbM2pLJrV9E0vKpTS2iC9SM_1Rwugsb/pub?output=csv" },
            { name: "ชมรมตะกร้อ", url: "https://docs.google.com/spreadsheets/d/e/2PACX-1vRUVBUL8xyDjsttjsERUFmtDZn0-k19Fq0sxhmLQW6XmRO6nOC8p3Q4e4luErVILQCUfmJ0XuRe4Y1I/pub?output=csv" },
            { name: "ชมรมเปตอง", url: "https://docs.google.com/spreadsheets/d/e/2PACX-1vToqZUGbAvLrSLA5lif0de-GEf6IgBiZnwo3-Zb5BiR8VwOVUYK3y_eYaRI-JBl4JscL0Cv4RngD-8h/pub?output=csv" },
            { name: "ชมรมเชฟตัวน้อย", url: "https://docs.google.com/spreadsheets/d/e/2PACX-1vQ_ie3zKIge6DgrkH10qH2HhKeoadwB1rW7H1yCwRTplDXHb_v5Qv7eaZkl8WaU2jVZ9L3ZmKYYlBNo/pub?output=csv" },
            { name: "ชมรมจิตอาสา", url: "https://docs.google.com/spreadsheets/d/e/2PACX-1vRgIOQy4SiQ_ontNitRFVp1hrB0gKNq3AVbGesxwh0iFHRUrKImwuvUYeXrO8h5lgORdEzMGqmaen3P/pub?output=csv" },
            { name: "ชมรมAnimation", url: "https://docs.google.com/spreadsheets/d/e/2PACX-1vRvqXasqupMnSKoxiOzZN8p2RJTcsFR-wQo6jOl8OEefpxn6cJVpvW3yLV8d893vffdTSg0BPKXvvOu/pub?output=csv" },
            { name: "Plant Club", url: "https://docs.google.com/spreadsheets/d/e/2PACX-1vSTRa3UG0MFe4cDRc3nrxyUAO6Kvwp1g3J-gi9KkQc0mP9ztGalXOKdzHZNuntcIHGTgEPBdoRwNz7S/pub?output=csv" },
            { name: "ชมรมบาสเกตบอล", url: "https://docs.google.com/spreadsheets/d/e/2PACX-1vRM0h6Ocje1sRjixVMvyNXL1sWNW4Gg8R-BTRgZswY4GUZESvFaFLoQ4li4LHO1b_ZzC1n6MKFy3Uze/pub?output=csv" },
            { name: "ชมรมดนตรี", url: "https://docs.google.com/spreadsheets/d/e/2PACX-1vTmHC0BQfZN0zpdo2yj-EaM-X1U9jd39IEHjtIG2jSL8FFrVx2G73ggr5DEBLZLPqsEhsT9vJuoqrWa/pub?output=csv" },
            { name: "ชมรมพิมพ์สัมผัสด้วยคอมพิวเตอร์", url: "https://docs.google.com/spreadsheets/d/e/2PACX-1vQ-fSeQGrSlUyTMacY-DSkzBNukN-WuTyPxX3hzousFcPq5B106XGYXOvB4MpYp9XedZTPsQMaMHDyW/pub?output=csv" },
            { name: "ชมรมหมากกระดาน", url: "https://docs.google.com/spreadsheets/d/e/2PACX-1vRPijUq9JykhPQRfJgn7lOVVuqx0BbN5iulKwXFJl4s41bPmXIVLAJRzb64RHPLqAPtd2ngxw4wclbN/pub?output=csv"}  
        ];

        let sheetsData = [];
        const tabsDiv = document.getElementById("tabs");
        const contentsDiv = document.getElementById("tab-contents");

        function createTable(rows, hideClubColumn = false) {
            if (!rows || rows.length <= 1) {
                const div = document.createElement("div");
                div.className = "flex flex-col items-center justify-center p-12 bg-white/50 rounded-3xl border border-dashed border-blue-300 text-blue-800 font-medium";
                div.innerHTML = `<i class="bi bi-search text-4xl mb-2 opacity-50"></i> ไม่พบข้อมูลที่ต้องการ`;
                return div;
            }

            const wrapper = document.createElement("div");
            wrapper.className = "table-wrapper overflow-x-auto rounded-2xl shadow-lg border border-gray-200 bg-white";

            const table = document.createElement("table");
            table.className = "w-full text-sm text-left border-collapse min-w-max";

            const thead = document.createElement("thead");
            const headRow = document.createElement("tr");

            let clubColumnIndex = -1;
            rows[0].forEach((h, idx) => {
                const headerLower = String(h).toLowerCase().trim();
                if (headerLower.includes("ชมรม") || headerLower === "club") {
                    clubColumnIndex = idx;
                }
            });

            rows[0].forEach((h, idx) => {
                if (hideClubColumn && idx === clubColumnIndex) return;
                const th = document.createElement("th");
                th.className = `p-4 bg-blue-100 text-blue-900 font-bold border-b border-gray-200 uppercase tracking-wider ${idx === 0 ? 'sticky-col bg-green-400' : ''}`;
                th.textContent = h || '';
                headRow.appendChild(th);
            });
            thead.appendChild(headRow);
            table.appendChild(thead);

            const tbody = document.createElement("tbody");
            for (let i = 1; i < rows.length; i++) {
                const r = rows[i];
                if (!r || r.length === 0) continue;
                
                const tr = document.createElement("tr");
                tr.className = "hover:bg-blue-50/80 transition-colors border-b border-gray-100";
                
                r.forEach((c, idx) => {
                    if (hideClubColumn && idx === clubColumnIndex) return;
                    const td = document.createElement("td");
                    td.className = `p-4 text-gray-700 whitespace-nowrap ${idx === 0 ? 'sticky-col bg-blue-50/90 font-medium shadow-sm' : ''}`;

                    const cellValue = String(c || '').trim().toUpperCase();
                    if (cellValue === "TRUE" || cellValue === "T") {
                        td.innerHTML = '<div class="text-center"><i class="bi bi-check-square-fill text-emerald-500 text-lg"></i></div>';
                    } else if (cellValue === "FALSE" || cellValue === "F") {
                        td.innerHTML = '<div class="text-center"><i class="bi bi-square text-rose-500 text-lg opacity-40"></i></div>';
                    } else {
                        td.textContent = c || '-';
                    }

                    tr.appendChild(td);
                });
                tbody.appendChild(tr);
            }

            table.appendChild(tbody);
            wrapper.appendChild(table);
            return wrapper;
        }

        function getCurrentTabIndex() {
            const activeTab = document.querySelector(".tab-button-active");
            if (!activeTab) return -1;
            return Array.from(tabsDiv.children).indexOf(activeTab) - 1;
        }

        function getFilteredData(sheetIndex) {
            const groupVal = document.getElementById("filter-group").value;
            const yearVal = document.getElementById("filter-year").value;
            const clubSelectVal = document.getElementById("filter-club-select").value;
            const clubVal = document.getElementById("filter-club").value.trim().toLowerCase();
            const roomVal = document.getElementById("filter-room").value;
            
            let allRows;
            if (sheetIndex === -1) {
                allRows = [];
                if (sheetsData.length > 0) {
                    allRows.push([...sheetsData[0][0]]);
                    sheetsData.forEach(sheet => {
                        allRows.push(...sheet.slice(1));
                    });
                }
            } else {
                allRows = sheetsData[sheetIndex].map(row => [...row]);
            }

            if (!allRows || allRows.length === 0) return [];

            const header = allRows[0];
            const filtered = [header];

            for (let i = 1; i < allRows.length; i++) {
                const r = allRows[i];
                const rowText = r.join(' ').toLowerCase();
                
                let matchGroup = groupVal === "all" || rowText.includes(groupVal.toLowerCase());
                let matchYear = yearVal === "all" || r.some(c => {
                    const cellText = String(c).trim();
                    return cellText === yearVal || cellText === `ปี ${yearVal}`;
                });
                
                let matchClubSelect = clubSelectVal === "all" || r.some(c => String(c).trim() === clubSelectVal);
                let matchClub = clubVal === "" || rowText.includes(clubVal);
                let matchRoom = roomVal === "all" || r.some(c => String(c).trim() === roomVal);
                
                if (matchGroup && matchYear && matchClubSelect && matchClub && matchRoom) {
                    filtered.push(r);
                }
            }

            // Sorting by student ID if filtered by room
            if (filtered.length > 1 && roomVal !== "all") {
                const dataRows = filtered.slice(1);
                dataRows.sort((a, b) => {
                    let idxA = 0, idxB = 0;
                    for (let i = 0; i < a.length; i++) {
                        if (/^\d{10,11}$/.test(String(a[i] || '').trim())) { idxA = i; break; }
                    }
                    for (let i = 0; i < b.length; i++) {
                        if (/^\d{10,11}$/.test(String(b[i] || '').trim())) { idxB = i; break; }
                    }
                    return String(a[idxA] || '').trim().localeCompare(String(b[idxB] || '').trim(), undefined, { numeric: true });
                });
                return [filtered[0], ...dataRows];
            }

            return filtered;
        }

        function filterTableData(sheetIndex) {
            const groupVal = document.getElementById("filter-group").value;
            const yearVal = document.getElementById("filter-year").value;
            const clubSelectVal = document.getElementById("filter-club-select").value;
            const clubVal = document.getElementById("filter-club").value.trim().toLowerCase();
            const roomVal = document.getElementById("filter-room").value;
            
            const filtered = getFilteredData(sheetIndex);
            const hideClubColumn = (groupVal !== "all" || yearVal !== "all") && 
                                 clubVal === "" && clubSelectVal === "all" && roomVal === "all";

            const targetId = sheetIndex === -1 ? "tab-content-all" : "tab-content-" + sheetIndex;
            const targetDiv = document.getElementById(targetId);
            
            if (targetDiv) {
                targetDiv.innerHTML = "";
                targetDiv.appendChild(createTable(filtered, hideClubColumn));
            }
        }

        async function loadSheets() {
            try {
                const fetchPromises = csvUrls.map(({ url }) => 
                    fetch(url)
                        .then(res => res.text())
                        .then(text => new Promise(res => Papa.parse(text, { skipEmptyLines: true, complete: results => res(results.data) })))
                );
                
                const allData = await Promise.all(fetchPromises);
                sheetsData = allData;
                contentsDiv.innerHTML = "";

                // Create "All Data" Tab
                createTabButton("ข้อมูลทั้งหมด", -1, true);
                createTabContent(-1, true);

                // Create Individual Club Tabs
                allData.forEach((_, i) => {
                    createTabButton(csvUrls[i].name, i);
                    createTabContent(i);
                });

                populateClubs();
                filterTableData(-1);
                
            } catch (error) {
                contentsDiv.innerHTML = `<div class="p-8 text-center bg-white rounded-3xl text-rose-600 border border-rose-200">
                    <i class="bi bi-exclamation-triangle text-3xl mb-2"></i>
                    <p>เกิดข้อผิดพลาด: ${error.message}</p>
                </div>`;
            }
        }

        function createTabButton(label, index, isActive = false) {
            const btn = document.createElement("button");
            btn.textContent = label;
            btn.className = `tab-button px-5 py-2.5 rounded-xl font-semibold transition-all shadow-sm flex-shrink-0 whitespace-nowrap ${
                isActive 
                ? "tab-button-active bg-blue-600 text-white shadow-blue-200 scale-105" 
                : "bg-white text-blue-600 hover:bg-blue-50 border border-blue-200"
            }`;
            
            btn.addEventListener("click", () => {
                document.querySelectorAll(".tab-button").forEach(b => {
                    b.classList.remove("tab-button-active", "bg-blue-600", "text-white", "shadow-blue-200", "scale-105");
                    b.classList.add("bg-white", "text-blue-600", "hover:bg-blue-50", "border-blue-200");
                });
                btn.classList.add("tab-button-active", "bg-blue-600", "text-white", "shadow-blue-200", "scale-105");
                btn.classList.remove("bg-white", "text-blue-600", "hover:bg-blue-50", "border-blue-200");
                
                document.querySelectorAll(".tab-content").forEach(c => c.classList.remove("active"));
                const targetId = index === -1 ? "tab-content-all" : "tab-content-" + index;
                document.getElementById(targetId).classList.add("active");
                filterTableData(index);
            });
            tabsDiv.appendChild(btn);
        }

        function createTabContent(index, isActive = false) {
            const div = document.createElement("div");
            div.id = index === -1 ? "tab-content-all" : "tab-content-" + index;
            div.className = `tab-content ${isActive ? 'active' : ''}`;
            contentsDiv.appendChild(div);
        }

        function populateClubs() {
            const clubSelect = document.getElementById("filter-club-select");
            Object.values(clubs).flat().sort().forEach(club => {
                const option = document.createElement("option");
                option.value = club;
                option.textContent = club;
                clubSelect.appendChild(option);
            });
        }

        // Event Listeners for Filters
        ["filter-group", "filter-year", "filter-room", "filter-club-select"].forEach(id => {
            document.getElementById(id).addEventListener("change", () => filterTableData(getCurrentTabIndex()));
        });
        document.getElementById("filter-club").addEventListener("input", () => filterTableData(getCurrentTabIndex()));

        // Export Function
        document.getElementById("export-btn").addEventListener("click", () => {
            const filtered = getFilteredData(getCurrentTabIndex());
            if (!filtered || filtered.length <= 1) return;

            const exportData = filtered.map((row, idx) => {
                if (idx === 0) return row;
                return row.map(cell => {
                    const val = String(cell || '').trim().toUpperCase();
                    return val === "TRUE" || val === "T" ? "✓" : (val === "FALSE" || val === "F" ? "✗" : cell);
                });
            });

            const ws = XLSX.utils.aoa_to_sheet(exportData);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "ClubData");
            XLSX.writeFile(wb, `IT_Club_Export_${Date.now()}.xlsx`);
        });

        loadSheets();
    </script>
</body>
